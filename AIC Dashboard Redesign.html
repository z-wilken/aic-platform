  /* Scale */
  --t12:12px; --t14:14px; --t16:16px; --t20:20px; --t28:28px; --t40:40px;
  /* Layout */
  --radius:8px;
  --shadow:0 1px 4px rgba(15,31,61,.08);

}
html,body{height:100%;background:var(--n50);color:var(--n900);font-family:var(--sans);font-size:var(--t14);line-height:1.5;-webkit-font-smoothing:antialiased}
#root{display:flex;min-height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--n200);border-radius:2px}
a{color:inherit;text-decoration:none}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes pulse3{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tick{from{stroke-dashoffset:var(--dash)}to{stroke-dashoffset:0}}

/* ── Skeleton shimmer ── */
.skel{background:linear-gradient(90deg,var(--n100) 25%,var(--n50) 50%,var(--n100) 75%);background-size={800}px 100%;animation:shimmer 1.4s infinite linear;border-radius:var(--radius)}

/* ── Cards ── */
.card{background:var(--n0);border:1px solid var(--n200);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:20px}

/* ── Mono label ── */
.mono-label{font-family:var(--mono);font-size={10}px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--n400)}

/* ── Tooltip ── */
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-wrap:hover .tip{opacity:1;pointer-events:auto;transform:translateY(0)}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--n900);color:var(--n0);font-size={11}px;line-height:1.5;padding:8px 12px;border-radius:6px;white-space:normal;width:220px;z-index:400;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;text-align:left;font-weight:400}
.tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--n900)}

/* ── Responsive main padding ── */
.main-content{padding:24px;max-width:1200px;width:100%;margin:0 auto}
@media(min-width:1280px){.main-content{padding:32px}}
@media(max-width:900px){.main-content{padding:16px}}
</style>

/* Primary button */
const Btn=({children,onClick,variant='primary',size='md',disabled,full,style={}})=>{
  const pad=size==='sm'?'7px 16px':'10px 20px';
  const fs=size==='sm'?12:13;
  if(variant==='primary') return(
    <button onClick={onClick} disabled={disabled} style={{display:'inline-flex',alignItems:'center',gap:6,
      background:disabled?'var(--n200)':'var(--gold)',color:disabled?'var(--n400)':'#fff',
      fontFamily:'var(--mono)',fontSize:fs,fontWeight:600,letterSpacing:'.1em',textTransform:'uppercase',
      borderRadius:100,padding:pad,cursor:disabled?'not-allowed':'pointer',transition:'background .12s',
      width:full?'100%':'auto',justifyContent:'center',...style}}
      onMouseEnter={e=>{if(!disabled)e.currentTarget.style.background='var(--amber)'}}
      onMouseLeave={e=>{if(!disabled)e.currentTarget.style.background='var(--gold)'}}
    >{children}</button>
  );
  return(
    <button onClick={onClick} disabled={disabled} style={{display:'inline-flex',alignItems:'center',gap:6,
      background:'transparent',color:disabled?'var(--n300)':'var(--n500)',
      fontFamily:'var(--mono)',fontSize:fs,fontWeight:600,letterSpacing:'.1em',textTransform:'uppercase',
      borderRadius:100,padding:pad,border:'1px solid var(--n200)',transition:'all .12s',
      width:full?'100%':'auto',justifyContent:'center',...style}}
      onMouseEnter={e=>{if(!disabled){e.currentTarget.style.borderColor='var(--gold)';e.currentTarget.style.color='var(--gold)';}}}
      onMouseLeave={e=>{if(!disabled){e.currentTarget.style.borderColor='var(--n200)';e.currentTarget.style.color='var(--n500)';}}}

};

/* Score ring */
const ScoreRing=({val,size=88,thick=6})=>{
  const r=size/2-thick-2; const c=2*Math.PI*r;
  const col=val>=71?'var(--green)':val>=41?'var(--gold)':'var(--red)';
  return(
    <svg width={size} height={size} style={{transform:'rotate(-90deg)',flexShrink:0}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--n100)" strokeWidth={thick}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={thick}
        strokeDasharray={`${c*(val/100)} ${c}`} strokeLinecap="round"
        style={{transition:'stroke-dasharray 1s ease'}}/>
    </svg>
  );
};

/* Upload Modal */
function UploadModal({label,onClose}){
  const [drag,setDrag]=useState(false);
  const [files,setFiles]=useState([]);
  const [busy,setBusy]=useState(false);
  const [done,setDone]=useState(false);
  const ref=useRef();
  const drop=useCallback(e=>{e.preventDefault();setDrag(false);setFiles(f=>[...f,...e.dataTransfer.files]);},[]);
  const submit=async()=>{setBusy(true);await new Promise(r=>setTimeout(r,1600));setDone(true);};
  return(
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
      style={{position:'fixed',inset:0,background:'rgba(15,31,61,.4)',zIndex:500,
        display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}}>
      <div className="card" style={{width:520,maxWidth:'95vw',animation:'fadeUp .2s ease',overflow:'hidden',boxShadow:'0 24px 64px rgba(15,31,61,.18)'}}>
        <div style={{padding:'20px 24px 16px',borderBottom:'1px solid var(--n200)',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div className="mono-label" style={{color:'var(--gold)',marginBottom:6}}>Submit Evidence</div>
            <h2 style={{fontFamily:'var(--serif)',fontSize:16,fontWeight:700,color:'var(--n900)',lineHeight:1.3}}>{label}</h2>
            <p style={{fontSize:12,color:'var(--n400)',marginTop:4}}>Hashed & timestamped on submission. AIC confirms receipt within 2 business days.</p>
          </div>
          <button onClick={onClose} style={{padding:4,color:'var(--n400)',borderRadius:6,marginLeft:12,flexShrink:0}}><Ic n="x" size={16}/></button>
        </div>
        <div style={{padding:'20px 24px 24px'}}>
          {done?(
            <div style={{textAlign:'center',padding:'28px 0'}}>
              <div style={{width:48,height:48,borderRadius:'50%',background:'var(--green-bg)',
                border:'1.5px solid var(--green)',display:'flex',alignItems:'center',justifyContent:'center',
                margin:'0 auto 12px'}}><Ic n="check" size={20} col="var(--green)"/></div>
              <div style={{fontFamily:'var(--serif)',fontSize:16,fontWeight:700,color:'var(--n900)',marginBottom:6}}>Submitted</div>
              <p style={{fontSize:13,color:'var(--n500)',marginBottom:20}}>{files.length} file{files.length!==1?'s':''} logged. Evidence receipt (DOC-011) generated.</p>
              <Btn onClick={onClose}>Close</Btn>
            </div>
          ):(
            <>
              <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={drop}
                onClick={()=>ref.current.click()}
                style={{border:`1.5px dashed ${drag?'var(--gold)':'var(--n200)'}`,borderRadius:8,padding:'24px 20px',
                  textAlign:'center',background:drag?'var(--gold-lo)':'var(--n50)',cursor:'pointer',transition:'all .12s',marginBottom:12}}>
                <Ic n="cloud" size={24} col={drag?'var(--gold)':'var(--n400)'} style={{marginBottom:8}}/>
                <div style={{fontSize:13,fontWeight:600,color:'var(--n700)',marginBottom:2}}>Drop files or <span style={{color:'var(--gold)'}}>browse</span></div>
                <div className="mono-label">PDF · DOCX · XLSX · PNG — max 50MB</div>
                <input ref={ref} type="file" multiple style={{display:'none'}} onChange={e=>setFiles(f=>[...f,...e.target.files])}/>
              </div>
              {files.length>0&&<div style={{marginBottom:12}}>{files.map((f,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',
                  background:'var(--n50)',borderRadius:7,marginBottom:4,border:'1px solid var(--n200)'}}>
                  <Ic n="doc" size={13} col="var(--gold)"/>
                  <span style={{flex:1,fontSize:12,fontWeight:500,color:'var(--n700)'}}>{f.name}</span>
                  <span className="mono-label">{(f.size/1024).toFixed(0)} KB</span>
                  <button onClick={()=>setFiles(fs=>fs.filter((_,j)=>j!==i))} style={{color:'var(--n400)'}}><Ic n="x" size={11}/></button>
                </div>
              ))}</div>}
              <div style={{background:'var(--gold-lo)',border:'1px solid var(--gold-gl)',borderRadius:8,
                padding:'9px 12px',marginBottom:16,display:'flex',gap:7}}>
                <Ic n="info" size={13} col="var(--gold)" style={{flexShrink:0,marginTop:1}}/>
                <p style={{fontSize:11,color:'var(--n700)',lineHeight:1.6}}>Submission confirms evidence accurately reflects current governance. False submissions may void certification.</p>
              </div>
              <div style={{display:'flex',gap:8}}>
                <Btn variant="outline" onClick={onClose}>Cancel</Btn>
                <Btn onClick={submit} disabled={files.length===0||busy} full>
                  {busy?<><span style={{width:11,height:11,border:'2px solid rgba(255,255,255,.3)',
                    borderTopColor:'#fff',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/>Submitting…</>
                    :<><Ic n="upload" size={12} col="#fff"/>Submit {files.length>0?`${files.length} File${files.length>1?'s':''}`:''}</>}
                </Btn>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* 4. Pulse Strip */
function PulseStrip(){
  const [time,setTime]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setTime(new Date()),5000);return()=>clearInterval(t);},[]);
  const {decisionsToday,overrideRate,overrideHealthMin,overrideHealthMax,
         openFindings,findingsMaxSev,daysToMilestone,milestoneLabel,sparkline}=DATA.pulse;

  const orPct=Math.min(overrideRate/overrideHealthMax,1)*100;
  const orHealthy=overrideRate>=overrideHealthMin&&overrideRate<=overrideHealthMax;
  const orCol=orHealthy?'var(--green)':overrideRate<overrideHealthMin?'var(--amber)':'var(--red)';
  const orStatus=orHealthy?'Healthy':overrideRate<overrideHealthMin?'Too low — review oversight':'Too high — investigate';

  const spMax=Math.max(...sparkline);
  const spMin=Math.min(...sparkline);
  const spNorm=sparkline.map(v=>(v-spMin)/(spMax-spMin||1));

  const svgW=100,svgH=28;
  const pts=spNorm.map((v,i)=>`${(i/(sparkline.length-1))*svgW},${svgH-(v*svgH*0.85+svgH*0.07)}`).join(' ');

  return(
    <div className="card card-p" style={{gridColumn:'1 / 3'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <Eyebrow>Pulse Telemetry</Eyebrow>
        <span className="mono-label" style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{width:5,height:5,borderRadius:'50%',background:'var(--green)',animation:'pulse3 2s infinite',display:'inline-block'}}/>
          Updated {time.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
        </span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:12}}>
        {/* Decisions today */}
        <Tip text="Total AI decisions processed today across all systems integrated with AIC Pulse.">
          <div style={{background:'var(--n50)',borderRadius:7,padding:'12px',border:'1px solid var(--n200)',cursor:'help'}}>
            <div className="mono-label" style={{marginBottom:6}}>Decisions Today</div>
            <div style={{fontFamily:'var(--mono)',fontSize:28,fontWeight:700,color:'var(--n900)',lineHeight:1,marginBottom:2}}>{decisionsToday.toLocaleString()}</div>
          </div>
        </Tip>

        {/* Override Rate — AIC-specific health band */}
        <Tip text={`Override rate measures how often a human reviewer changes the AI's recommendation. Healthy band: ${overrideHealthMin}–${overrideHealthMax}%. Too low suggests rubber-stamping; too high suggests a poorly-calibrated model.`}>
          <div style={{background:'var(--n50)',borderRadius:7,padding:'12px',border:'1px solid var(--n200)',cursor:'help'}}>
            <div className="mono-label" style={{marginBottom:6}}>Override Rate</div>
            <div style={{fontFamily:'var(--mono)',fontSize:28,fontWeight:700,color:orCol,lineHeight:1,marginBottom:6}}>{overrideRate.toFixed(1)}%</div>
            {/* Health band visual */}
            <div style={{position:'relative',height:6,background:'var(--n200)',borderRadius:3,marginBottom:4,overflow:'hidden'}}>
              {/* green zone */}
              <div style={{position:'absolute',left:`${(overrideHealthMin/overrideHealthMax/1.5)*100}%`,
                width:`${((overrideHealthMax-overrideHealthMin)/overrideHealthMax/1.5)*100}%`,
                height:'100%',background:'var(--green-bg)',opacity:.6}}/>
              {/* current marker */}
              <div style={{position:'absolute',top:0,bottom:0,width:2,borderRadius:1,
                background:orCol,left:`calc(${Math.min(orPct,98)}% - 1px)`,transition:'left 1s ease'}}/>
            </div>
            <div style={{fontSize:10,color:orCol,fontWeight:500}}>{orStatus}</div>
          </div>
        </Tip>

        {/* Open Findings */}
        <Tip text="Total open audit findings (critical + significant). All critical findings must be resolved before certification can proceed.">
          <div style={{background:findingsMaxSev==='critical'?'var(--red-bg)':'var(--amber-bg)',
            borderRadius:7,padding:'12px',border:`1px solid ${findingsMaxSev==='critical'?'rgba(185,28,28,.15)':'rgba(180,83,9,.15)'}`,cursor:'help'}}>
            <div className="mono-label" style={{color:findingsMaxSev==='critical'?'var(--red)':'var(--amber)',marginBottom:6}}>Open Findings</div>
            <div style={{fontFamily:'var(--mono)',fontSize:28,fontWeight:700,
              color:findingsMaxSev==='critical'?'var(--red)':'var(--amber)',lineHeight:1,marginBottom:2}}>{openFindings}</div>
            <Pill s={findingsMaxSev} small/>
          </div>
        </Tip>

        {/* Days to milestone */}
        <Tip text={`Days until: ${milestoneLabel}. After this date, unresolved Critical findings will cause the assessment to lapse.`}>
          <div style={{background:'var(--n50)',borderRadius:7,padding:'12px',border:'1px solid var(--n200)',cursor:'help'}}>
            <div className="mono-label" style={{marginBottom:6}}>Days to Deadline</div>
            <div style={{fontFamily:'var(--mono)',fontSize:28,fontWeight:700,
              color:daysToMilestone<=7?'var(--red)':daysToMilestone<=14?'var(--amber)':'var(--n900)',
              lineHeight:1,marginBottom:2}}>{daysToMilestone}</div>
            <div style={{fontSize:10,color:'var(--n500)'}}>{milestoneLabel}</div>
          </div>
        </Tip>
      </div>

      {/* Sparkline */}
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div className="mono-label">7-day decision volume</div>
        <svg width="100%" height="28" viewBox={`0 0 ${svgW} ${svgH}`} preserveAspectRatio="none"
          style={{flex:1,maxHeight:28}}>
          <polyline fill="none" stroke="var(--gold)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"
            points={pts}/>
        </svg>
        <span className="mono-label">{sparkline[sparkline.length-1].toLocaleString()} today</span>
      </div>
    </div>
  );
}

              <div style={{fontSize:13,fontWeight:700,color:'var(--n900)'}}>{DATA.accountablePerson.name}</div>
              <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--gold)'}}>{DATA.accountablePerson.role}</div>
            </div>
          </div>
          {[{k:'Email',v:'s.chen@meridianfin.co.za'},{k:'Phone',v:'+27 11 555 0192'},{k:'Declaration Signed',v:'Apr 1, 2026 (DOC-005)'},{k:'Authority',v:'Full override authority confirmed'}].map(r=>(
            <div key={r.k} style={{padding:'7px 0',borderBottom:'1px solid var(--n100)'}}>
              <div style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--n400)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:2}}>{r.k}</div>
              <div style={{fontSize:12,fontWeight:500,color:'var(--n900)'}}>{r.v}</div>
            </div>
          ))}
          <Btn variant="outline" full style={{marginTop:12}}><Ic n="user" size={11}/>Change Accountable Person</Btn>
        </div>
        <div className="card card-p">
          <Eyebrow>AI Systems in Scope</Eyebrow>
          {DATA.aiSystems.map((s,i)=>(
            <div key={s.name} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 0',borderBottom:i<DATA.aiSystems.length-1?'1px solid var(--n100)':'none'}}>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:600,color:'var(--n900)'}}>{s.name}</div>
                <div style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--n400)'}}>{s.tier}</div>
              </div>
              <Pill s={s.status} small/>
            </div>
          ))}
          <button style={{width:'100%',marginTop:10,display:'flex',alignItems:'center',justifyContent:'center',gap:6,padding:'8px',border:'1px dashed var(--n200)',borderRadius:7,fontFamily:'var(--mono)',fontSize:9,fontWeight:600,color:'var(--n400)',transition:'all .12s'}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--gold)';e.currentTarget.style.color='var(--gold)';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--n200)';e.currentTarget.style.color='var(--n400)';}}
          ><Ic n="plus" size={11}/>Declare New AI System</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   PAGE: CORRESPONDENCE (Findings > Correspondence tab)
══════════════════════════════════════════════════════════════════════════ */
function PageCorrespondence(){
  const [msg,setMsg]=useState('');
  const [sent,setSent]=useState(false);
  const send=()=>{if(msg.trim()){setSent(true);setMsg('');setTimeout(()=>setSent(false),3000);}};
  return(
    <div style={{animation:'fadeUp .2s ease',display:'grid',gridTemplateColumns:'1fr 260px',gap:16,alignItems:'flex-start'}}>
      <div>
        <div className="card" style={{marginBottom:12}}>
          <div style={{padding:'14px 16px',borderBottom:'1px solid var(--n200)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span className="mono-label">Thread — {DATA.certification.ref}</span>
            <Pill s="partial" small/>
          </div>
          {DATA.messages.map((m,i)=>(
            <div key={m.id} style={{display:'flex',gap:10,padding:'12px 14px',
              background:m.unread?'var(--n50)':'transparent',
              borderBottom:i<DATA.messages.length-1?'1px solid var(--n100)':'none'}}>
              <div style={{width:32,height:32,borderRadius:8,background:'var(--navy)',
                display:'flex',alignItems:'center',justifyContent:'center',
                fontFamily:'var(--mono)',fontSize:9,fontWeight:700,color:'var(--gold)',flexShrink:0}}>{m.initials}</div>
              <div style={{flex:1}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:12,fontWeight:600,color:'var(--n900)'}}>{m.author}</span>
                  <div style={{display:'flex',gap:7,alignItems:'center'}}>
                    {m.unread&&<MonoTag>Unread</MonoTag>}
                    <span className="mono-label">{m.time}</span>
                  </div>
                </div>
                <p style={{fontSize:12,color:'var(--n500)',lineHeight:1.65}}>{m.text}</p>
              </div>
            </div>
          ))}
          {sent&&<div style={{padding:'10px 14px',background:'var(--green-bg)',display:'flex',gap:8,alignItems:'center'}}>
            <Ic n="check" size={13} col="var(--green)"/><span style={{fontSize:12,color:'var(--green)',fontWeight:500}}>Message sent.</span>
          </div>}
        </div>
        <div className="card card-p">
          <div className="mono-label" style={{marginBottom:10}}>Reply to Auditor</div>
          <textarea value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Type your message…"
            style={{width:'100%',background:'var(--n50)',border:'1px solid var(--n200)',borderRadius:7,
              color:'var(--n900)',fontSize:13,padding:'10px 12px',resize:'vertical',minHeight:90,
              outline:'none',lineHeight:1.6,transition:'border-color .12s'}}
            onFocus={e=>e.target.style.borderColor='var(--gold)'}
            onBlur={e=>e.target.style.borderColor='var(--n200)'}/>
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:10}}>
            <Btn onClick={send} disabled={!msg.trim()}><Ic n="send" size={12} col="#fff"/>Send Message</Btn>
          </div>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div className="card card-p">
          <div className="mono-label" style={{marginBottom:10}}>Your Auditor</div>
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:12}}>
            <div style={{width:36,height:36,borderRadius:9,background:'var(--navy)',
              display:'flex',alignItems:'center',justifyContent:'center',
              fontFamily:'var(--mono)',fontSize:10,fontWeight:700,color:'var(--gold)',flexShrink:0}}>AIC</div>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:'var(--n900)'}}>System Auditor</div>
              <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--gold)'}}>AI Integrity Certification</div>
            </div>
          </div>
          <p style={{fontSize:11,color:'var(--n500)',lineHeight:1.6,marginBottom:8}}>Response within 2 business days. Ref: {DATA.certification.ref}</p>
        </div>
        <div className="card card-p">
          <div className="mono-label" style={{marginBottom:10}}>Communication Rules</div>
          {['All correspondence is logged as part of the audit record','Do not share personal information of affected persons in messages','Submit remediation evidence via Evidence Vault, not in messages'].map((r,i)=>(
            <div key={i} style={{display:'flex',gap:7,marginBottom:8,alignItems:'flex-start'}}>
              <Ic n="info" size={12} col="var(--gold)" style={{flexShrink:0,marginTop:1}}/>
              <span style={{fontSize:11,color:'var(--n500)',lineHeight:1.5}}>{r}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════════════════════════ */
function App(){
  const [page,setPage]=useState('Dashboard');
  const [notifOpen,setNotifOpen]=useState(false);
  const [modal,setModal]=useState(null);

  // Close notif on outside click
  const notifRef=useRef();

  const PAGES={
    'Dashboard':            <PageDashboard setPage={setPage} openUpload={setModal}/>,
    'Evidence Vault':       <PageEvidenceVault openUpload={setModal}/>,
    'Pulse Monitor':        <PagePulse/>,
    'Findings':             <PageFindings openUpload={setModal}/>,
    'Auditor Findings':     <PageFindings openUpload={setModal}/>,
    'Compliance Reports':   <PageReports/>,
    'Correspondence':       <PageCorrespondence/>,
    'My Certificate':       <PageCertificate/>,
    'Practitioner (CAAP)':  <PageCAP/>,
    'API & Access Keys':    <PageKeys/>,
    'Organisation Profile': <PageOrg/>,
    'Profile':              <PageOrg/>,
    'Reports':              <PageReports/>,
  };

  return(
    <div style={{display:'flex',minHeight:'100vh',background:'var(--n50)'}}>
      <Sidebar page={page} setPage={p=>{setPage(p);setNotifOpen(false);}}/>

      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflowY:'auto'}}>
        <Header page={page} setPage={setPage} notifOpen={notifOpen} setNotifOpen={setNotifOpen}/>

        <main className="main-content">
          {PAGES[page]||<PageDashboard setPage={setPage} openUpload={setModal}/>}
        </main>
      </div>

      {modal&&<UploadModal label={modal} onClose={()=>setModal(null)}/>}

      {/* Gemini data-wiring prompt — accessible via browser console */}
      
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
